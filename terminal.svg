<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" width="1000px" height="520px" font-size="14px">
<style>
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .cursor { animation: blink 1s infinite; fill: #a6e3a1; }
  .key { fill: #fab387; font-weight: bold; } /* Peach */
  .value { fill: #89b4fa; } /* Blue */
  .cc { fill: #585b70; } /* Surface2 / Overlay */
  .prompt { fill: #a6e3a1; font-weight: bold; } /* Green */
  .title { fill: #cba6f7; font-weight: bold; } /* Mauve */
  .ascii { fill: #cdd6f4; } /* Text */
  
  a { text-decoration: none; }
  a:hover tspan.value { text-decoration: underline; fill: #74c7ec; } /* Sapphire */
  text, tspan { white-space: pre; }
</style>

